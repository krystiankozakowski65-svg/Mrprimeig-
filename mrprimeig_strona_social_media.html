<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRPRIMEIG</title>
<link rel="icon" type="image/png" href="avatar_PNG47">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, #1a1a2e, #0b0f1a 60%),
        radial-gradient(circle at 80% 80%, rgba(106,60,255,0.06), transparent 65%),
        radial-gradient(circle at 60% 30%, rgba(0,198,255,0.12), transparent 55%);
      animation: bgShift 12s ease infinite;
    }

    @keyframes bgShift {
      0% { filter: hue-rotate(0deg); }
      50% { filter: hue-rotate(6deg); }
      100% { filter: hue-rotate(0deg); }
    }

    body::before {
      content: "";
      position: fixed;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 1px,
        transparent 1px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    body::after {
      content: "";
      position: fixed;
      width: 250%;
      height: 250%;
      background:
        radial-gradient(circle at 20% 30%, rgba(0,198,255,0.22), transparent 40%),
        radial-gradient(circle at 70% 60%, rgba(106,60,255,0.05), transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(0,255,204,0.10), transparent 55%);
      animation: moveGlow 10s ease-in-out infinite;
      z-index: 0;
      filter: blur(22px);
      pointer-events: none; /* 🔥 FIX KLIKÓW */
    }

    @keyframes moveGlow {
      0% { transform: translate(0,0) scale(1); }
      50% { transform: translate(-5%, -4%) scale(1.05); }
      100% { transform: translate(0,0) scale(1); }
    }

    .card {
      position: relative;
      width: 380px;
      padding: 30px;
      border-radius: 25px;
      text-align: center;
      color: white;
      z-index: 10;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(18px);
      box-shadow: 0 0 25px rgba(0,198,255,0.18);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 25px;
      padding: 2px;
      background: linear-gradient(90deg, #00c6ff, #00aaff, #00ffcc);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .avatar {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      margin: 0 auto 15px;
      background-image: url('https://media.discordapp.net/attachments/1492847231873847455/1505972451266269285/Nowy_projekt.png?ex=6a0c91a3&is=6a0b4023&hm=12df1dea88d518d3c248172b3613f20c7958f46e8377f86246353ea44e878968&=&format=webp&quality=lossless');
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 18px #00c6ff;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 5px;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(0,198,255,0.25);
    }

    .tag {
      font-size: 12px;
      opacity: 0.65;
      margin-bottom: 15px;
    }

    p {
      font-size: 14px;
      opacity: 0.75;
      margin-bottom: 20px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 12px 0;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      transition: 0.3s;
      position: relative;
      z-index: 20;
    }

    .btn:hover {
      transform: scale(1.05);
      border-color: #00c6ff;
      box-shadow: 0 0 18px #00c6ff;
    }

    .icon {
      width: 18px;
      height: 18px;
      fill: white;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="avatar"></div>
    <h1>@MRPRIMEIG</h1>
    <div class="tag">Content Creator • Twitch Live • Gaming Community 🔥</div>
    <p>Oficjalne kanały MRPRIMEIG 🔥</p>

    <a class="btn" href="https://twitch.tv/mrprimeig" target="_blank">

      </svg>
      Twitch
    </a>

    <a class="btn" href="https://discord.gg/dVkaG9BD" target="_blank">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M20 4.6A16 16 0 0 0 16 3l-.2.4a14 14 0 0 1 3.3 1.3 13 13 0 0 0-12.4 0A14 14 0 0 1 10 3.1L9.8 3A16 16 0 0 0 4 4.6C2.1 7.5 1.6 10.3 2 13c1.6 1.2 3.1 2 4.6 2.6l.6-.8c-1-.4-2-.9-2.9-1.6 2.4 1.1 5 1.8 7.7 1.8s5.3-.7 7.7-1.8c-.9.7-1.9 1.2-2.9 1.6l.6.8c1.5-.6 3-1.4 4.6-2.6.4-2.7-.1-5.5-2-8.4zM8.5 12.5c-.8 0-1.5-.7-1.5-1.5S7.7 9.5 8.5 9.5 10 10.2 10 11s-.7 1.5-1.5 1.5z"/>
      </svg>
      Discord
    </a>

  </div>

</body>
</html>
